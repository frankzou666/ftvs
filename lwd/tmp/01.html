<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap 多标签页面</title>
    <!-- 引入 Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* 全局页面背景和字体样式 */
        body {
            background-color: #f7f9fc;
            font-family: 'Arial', sans-serif;
        }

        /* 容器的样式 */
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }

        /* 标题样式 */
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-weight: bold;
        }

        /* 导航标签样式 */
        .nav-tabs .nav-link {
            border-radius: 10px;
            color: #555;
            padding: 10px 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        .nav-tabs .nav-link.active {
            background-color: #007bff;
            color: white;
            box-shadow: 0px 3px 6px rgba(0, 123, 255, 0.3);
        }

        .nav-tabs .nav-link:hover {
            background-color: #f0f0f0;
            color: #007bff;
        }

        /* 标签内容样式 */
        .tab-content {
            margin-top: 20px;
            padding: 20px;
            background-color: #f9f9f9;
            border-radius: 10px;
            border: 1px solid #ddd;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.05);
        }

        /* 标签内文字样式 */
        .tab-pane h3 {
            color: #007bff;
        }

        .tab-pane p {
            font-size: 16px;
            line-height: 1.6;
            color: #555;
        }

        /* 调整按钮外观 */
        button.nav-link {
            outline: none;
        }
    </style>
</head>
<body>

<div class="container mt-5">
    <h2>自助服务中控台</h2>

    <!-- 导航标签 -->
    <ul class="nav nav-tabs" id="myTab" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="home-tab" data-bs-toggle="tab" data-bs-target="#home" type="button" role="tab" aria-controls="home" aria-selected="true">造数据</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="profile-tab" data-bs-toggle="tab" data-bs-target="#profile" type="button" role="tab" aria-controls="profile" aria-selected="false">查验证码</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="contact-tab" data-bs-toggle="tab" data-bs-target="#contact" type="button" role="tab" aria-controls="contact" aria-selected="false">联系我们</button>
        </li>
    </ul>

    <!-- 标签内容 -->
    <div class="tab-content mt-3" id="myTabContent">
        <div class="tab-pane fade show active" id="home" role="tabpanel" aria-labelledby="home-tab">
            <h3>造数据</h3>
            <input type="text" class="form-control" placeholder="输入一些内容...">
            <input type="text" class="form-control" placeholder="输入一些内容...">

            <!-- 下拉框 -->
            <select class="form-select" aria-label="选择一个选项">
                <option selected>选择一个选项</option>
                <option value="1">选项 1</option>
                <option value="2">选项 2</option>
                <option value="3">选项 3</option>
            </select>
        </div>
        <div class="tab-pane fade" id="profile" role="tabpanel" aria-labelledby="profile-tab">
            <h3>查验证码</h3>
        </div>
    </div>
</div>

<!-- 引入 Bootstrap JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
